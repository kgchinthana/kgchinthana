name: Profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 06:00 Sri Lanka time
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      # GitHub stats card -> metrics/stats.svg
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kgchinthana
          filename: metrics/stats.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Colombo
          config_display: large

      # Top languages card -> metrics/languages.svg
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kgchinthana
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          config_timezone: Asia/Colombo

  snake:
    runs-on: ubuntu-latest
    steps:
      # Contribution snake -> "output" branch
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kgchinthana
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
